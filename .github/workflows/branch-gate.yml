# Branch gate: feature/<ISSUE-ID> -> develop -> main, each hop test-gated.
# Policy: ~/.config/agent-policy/git-workflow.md

name: Branch Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Tests (branch gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile tracked Python sources (syntax gate)
        run: |
          if ! python -m compileall -q agents scripts; then
            echo "::error::Syntax error in agents/ or scripts/ - branch gate failed."
            exit 1
          fi
          echo "All Python files under agents/ and scripts/ compiled cleanly."
